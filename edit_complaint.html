{% extends "base.html" %}

{% block content %}
<div class="dashboard-content" style="display: flex; justify-content: center; align-items: center; min-height: 85vh; background-color: #d6d9d2; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px;">
    
    <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); width: 480px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); position: relative; overflow: hidden;">
        
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #7a8c5f;"></div>

        <h2 style="color: #2f3635; margin-bottom: 5px; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px;">Update Complaint</h2>
        <p style="color: #6b7775; font-size: 0.85rem; margin-bottom: 30px; font-weight: 600; font-family: monospace;">Ref ID: #{{ complaint.complaint_id }}</p>
        
        <form action="{{ url_for('edit_complaint', id=complaint.complaint_id) }}" method="POST">
            
            <div style="margin-bottom: 25px;">
                <label class="earth-label">Management Status</label>
                <div style="position: relative;">
                    <select name="status" class="earth-input" style="width:100%; box-sizing: border-box; cursor: pointer; appearance: none;">
                        <option value="Pending" {% if complaint.status == 'Pending' %}selected{% endif %}>🟡 Pending Review</option>
                        <option value="In Progress" {% if complaint.status == 'In Progress' %}selected{% endif %}>🔵 In Progress</option>
                        <option value="Resolved" {% if complaint.status == 'Resolved' %}selected{% endif %}>🟢 Resolved</option>
                        <option value="Rejected" {% if complaint.status == 'Rejected' %}selected{% endif %}>🔴 Rejected</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 30px;">
                <label class="earth-label">Issue Details</label>
                <textarea name="issue_description" class="earth-input" style="width:100%; box-sizing: border-box; resize: none; line-height: 1.6; font-family: inherit;" rows="5" {{ 'readonly' if session['role'] == 'Admin' }}>{{ complaint.issue_description }}</textarea>
                
                {% if session['role'] == 'Admin' %}
                    <span style="color: #8c9795; font-size: 0.7rem; margin-top: 5px; display: block; font-weight: 600;">* Citizen descriptions are read-only for Admins.</span>
                {% endif %}
            </div>

            <button type="submit" class="earth-save-btn" style="width: 100%; padding: 16px;">
                Confirm Changes
            </button>
            
            <div style="display: flex; justify-content: space-between; margin-top: 25px; align-items: center;">
                <a href="javascript:history.back()" class="earth-link">← Cancel</a>
                <span style="color: rgba(0,0,0,0.1);">|</span>
                <a href="{{ url_for('complaint') if session['role'] == 'Citizen' else url_for('complaintres') }}" class="earth-link">View All</a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Labels & Inputs */
    .earth-label { 
        display: block; 
        margin-bottom: 8px; 
        font-size: 0.7rem; 
        font-weight: 800; 
        color: #7e8a88; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }
    
    .earth-input { 
        border: 1px solid rgba(0,0,0,0.08); 
        background: rgba(255,255,255,0.6); 
        padding: 12px 15px; 
        border-radius: 12px; 
        outline: none; 
        transition: 0.3s; 
        color: #2f3635; 
        font-size: 0.9rem;
    }
    .earth-input:focus { 
        background: rgba(255,255,255,0.9); 
        border-color: #7a8c5f; 
        box-shadow: 0 0 0 4px rgba(122, 140, 95, 0.1);
    }

    /* Buttons */
    .earth-save-btn { 
        background: #7a8c5f; 
        color: #fff; 
        border: none; 
        border-radius: 12px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.3s; 
        text-transform: uppercase; 
        font-size: 0.85rem; 
        letter-spacing: 0.5px;
    }
    .earth-save-btn:hover { 
        background: #5d6b49; 
        box-shadow: 0 10px 20px rgba(122, 140, 95, 0.2); 
        transform: translateY(-1px);
    }

    /* Links */
    .earth-link {
        color: #6b7775; 
        text-decoration: none; 
        font-size: 0.85rem; 
        font-weight: 700;
        transition: 0.2s;
    }
    .earth-link:hover {
        color: #2f3635;
    }
</style>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="dashboard-content" style="padding: 40px; background-color: #d6d9d2; min-height: 100vh; color: #4a5553; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        
        <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.03); position: relative; overflow: hidden;">
            
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #7a8c5f;"></div>

            <h2 style="color: #2f3635; margin: 0 0 5px 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Security Settings</h2>
            <p style="color: #6b7775; font-size: 0.85rem; margin-bottom: 35px; font-weight: 600;">Manage your WastePro account credentials.</p>

            <form method="POST">
                
                <div style="margin-bottom: 25px;">
                    <label class="earth-label">Username</label>
                    <input type="text" name="username" value="{{ user.username }}" class="earth-input" style="width: 100%; box-sizing: border-box;" required>
                </div>

                <div style="margin-bottom: 25px;">
                    <label class="earth-label">Email Address</label>
                    <input type="email" name="email" value="{{ user.email }}" class="earth-input" style="width: 100%; box-sizing: border-box;" required>
                </div>

                <div style="margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.3); border-radius: 14px; border: 1px dashed rgba(0,0,0,0.1);">
                    <label class="earth-label" style="color: #5d6b49;">Reset Password</label>
                    <input type="password" name="password" placeholder="••••••••" class="earth-input" style="width: 100%; box-sizing: border-box;">
                    <p style="color: #8c9795; font-size: 0.75rem; margin-top: 8px; font-style: italic; font-weight: 600;">Keep blank to leave password unchanged.</p>
                </div>

                <button type="submit" class="earth-save-btn" style="width: 100%; padding: 15px;">Confirm Changes</button>
                
                <a href="{{ url_for('profile') }}" style="display: block; text-align: center; color: #6b7775; margin-top: 25px; text-decoration: none; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s;">
                    Cancel and Return
                </a>
            </form>
        </div>
    </div>
</div>

<style>
    /* Labels & Inputs */
    .earth-label { 
        display: block; 
        margin-bottom: 8px; 
        font-size: 0.7rem; 
        font-weight: 800; 
        color: #7e8a88; 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }
    
    .earth-input { 
        border: 1px solid rgba(0,0,0,0.08); 
        background: rgba(255,255,255,0.6); 
        padding: 12px 15px; 
        border-radius: 12px; 
        outline: none; 
        transition: 0.3s; 
        color: #2f3635; 
        font-size: 0.9rem;
    }
    .earth-input:focus { 
        background: rgba(255,255,255,0.9); 
        border-color: #7a8c5f; 
        box-shadow: 0 0 0 4px rgba(122, 140, 95, 0.1);
    }

    /* Buttons */
    .earth-save-btn { 
        background: #7a8c5f; 
        color: #fff; 
        border: none; 
        border-radius: 12px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.3s; 
        text-transform: uppercase; 
        font-size: 0.85rem; 
        letter-spacing: 0.5px;
    }
    .earth-save-btn:hover { 
        background: #5d6b49; 
        box-shadow: 0 10px 20px rgba(122, 140, 95, 0.2); 
        transform: translateY(-1px);
    }

    /* Links */
    a:hover {
        color: #2f3635 !important;
    }
</style>
{% endblock %}

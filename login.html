{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card-container">
        <div class="brand-header">
            <h1>Waste<span style="color: #7a8c5f;">Pro</span></h1>
            <p>Smart City Management</p>
        </div>

        <div class="auth-card">
            <h3>Login</h3>
            
            <form action="{{ url_for('login') }}" method="POST">
                
                <div class="role-tabs">
                    <label class="tab-item">
                        <input type="radio" name="role" value="Citizen" checked>
                        <div class="tab-content citizen">Citizen Login</div>
                    </label>
                    <label class="tab-item">
                        <input type="radio" name="role" value="Admin">
                        <div class="tab-content admin">Admin Login</div>
                    </label>
                </div>

                <div class="input-group">
                    <label class="field-label">Username</label>
                    <input type="text" name="username" class="sage-input" placeholder="e.g. jdoe_01" required>
                </div>

                <div class="input-group" style="margin-bottom: 10px;">
                    <label class="field-label">Password</label>
                    <input type="password" name="password" class="sage-input" placeholder="••••••••" required>
                </div>
                
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="{{ url_for('forgot_password') }}" class="footer-link secondary-small">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn-primary">Login</button>
            </form>

            <div class="auth-footer">
                <p>New here? <a href="/signup" class="footer-link primary">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    .login-wrapper * {
        pointer-events: auto !important;
    }
    
    /* Full Page Layout */
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #d6d9d2; /* Signature Stone color */
        padding: 20px;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .login-card-container {
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    .brand-header { margin-bottom: 30px; }
    .brand-header h1 { font-size: 2.8rem; font-weight: 800; color: #2f3635; margin: 0; letter-spacing: -1.5px; }
    .brand-header p { color: #7e8a88; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2.5px; margin-top: 5px; }

    /* The Main Card */
    .auth-card {
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 45px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        text-align: left;
        position: relative;
        z-index: 1;
    }

    .auth-card h3 { color: #2f3635; font-size: 1.3rem; font-weight: 800; margin-bottom: 30px; text-align: center; margin-top: 0; }

    /* Role Tabs */
    .role-tabs { display: flex; gap: 12px; margin-bottom: 30px; }
    .tab-item { flex: 1; cursor: pointer; }
    .tab-item input { display: none; }
    
    .tab-content {
        padding: 14px;
        text-align: center;
        border-radius: 14px;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        background: rgba(0,0,0,0.04);
        color: #7e8a88;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid transparent;
    }

    .tab-item input:checked + .citizen { background: #7a8c5f; color: white; box-shadow: 0 4px 12px rgba(122, 140, 95, 0.3); }
    .tab-item input:checked + .admin { background: #3e4a49; color: white; box-shadow: 0 4px 12px rgba(62, 74, 73, 0.3); }

    /* Inputs */
    .input-group { margin-bottom: 22px; }
    .field-label { display: block; font-size: 0.7rem; font-weight: 800; color: #7e8a88; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; }

    .sage-input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 14px;
        outline: none;
        font-size: 1rem;
        transition: 0.3s;
        box-sizing: border-box;
        color: #2f3635;
    }

    .sage-input:focus { border-color: #7a8c5f; background: #fff; box-shadow: 0 0 0 4px rgba(122, 140, 95, 0.1); }

    /* Primary Button */
    .login-btn-primary {
        width: 100%;
        padding: 18px;
        background: #2f3635;
        color: white;
        border: none;
        border-radius: 14px;
        font-weight: 800;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 5px;
    }

    .login-btn-primary:hover { background: #1a1e1e; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); }

    /* Footer Links */
    .auth-footer { 
        margin-top: 35px; 
        text-align: center; 
        font-size: 0.85rem; 
        color: #7e8a88; 
        font-weight: 600;
        position: relative;
        z-index: 10;
    }
    
    .footer-link { 
        text-decoration: none; 
        font-weight: 800; 
        transition: 0.2s; 
        cursor: pointer !important;
        pointer-events: auto !important;
        position: relative;
        z-index: 10;
    }
    
    .footer-link.primary { color: #7a8c5f; margin-left: 5px; }
    .footer-link.secondary-small { color: #7e8a88; font-size: 0.8rem; font-weight: 600; }
    .footer-link:hover { opacity: 0.7; text-decoration: underline; }
</style>
{% endblock %}

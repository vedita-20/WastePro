{% extends "base.html" %}

{% block content %}
<div class="dashboard-content" style="display: flex; justify-content: center; align-items: center; min-height: 90vh; background-color: #d6d9d2; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); padding: 45px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); border-top: 6px solid #7a8c5f; width: 100%; max-width: 550px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);">
        
        <div style="text-align: center; margin-bottom: 35px;">
            <h2 style="color: #2f3635; margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Modify Logistics Record</h2>
            <p style="color: #7a8c5f; font-size: 0.75rem; font-weight: 800; margin-top: 8px; text-transform: uppercase; letter-spacing: 1.5px;">
                Log Identifier: <span style="font-family: monospace;">#{{ r.record_id }}</span>
            </p>
        </div>

        <form action="{{ url_for('editcr', id=r.record_id) }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label class="earth-label">Service Area</label>
                <select name="area_id" class="earth-input" style="width: 100%; box-sizing: border-box;">
                    {% for a in areas %}
                    <option value="{{ a.area_id }}" {% if a.area_id == r.area_id %}selected{% endif %}>{{ a.area_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="earth-label">Assigned Vehicle</label>
                <select name="vehicle_id" class="earth-input" style="width: 100%; box-sizing: border-box;">
                    {% for v in vehicles %}
                    <option value="{{ v.vehicle_id }}" {% if v.vehicle_id == r.vehicle_id %}selected{% endif %}>{{ v.vehicle_number }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="earth-label">Waste Category</label>
                <select name="waste_id" class="earth-input" style="width: 100%; box-sizing: border-box;">
                    {% for w in waste_types %}
                    <option value="{{ w.waste_id }}" {% if w.waste_id == r.waste_id %}selected{% endif %}>{{ w.type_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 35px;">
                <div>
                    <label class="earth-label">Quantity (KG)</label>
                    <input type="number" step="0.01" name="quantity_collected_kg" value="{{ r.quantity_collected_kg }}" class="earth-input" style="width: 100%; box-sizing: border-box;">
                </div>
                <div>
                    <label class="earth-label">Collection Date</label>
                    <input type="date" name="collection_date" value="{{ r.collection_date }}" class="earth-input" style="width: 100%; box-sizing: border-box;">
                </div>
            </div>

            <button type="submit" class="earth-save-btn" style="width: 100%; height: 55px; font-size: 0.9rem; letter-spacing: 1px;">
                Update Database Record
            </button>
            
            <a href="{{ url_for('collectionrecord') }}" class="earth-discard-link">
                Discard Changes
            </a>
        </form>
    </div>
</div>

<style>
    /* Earth Sage UI Toolkit */
    .earth-label { 
        display: block; 
        margin-bottom: 8px; 
        font-size: 0.7rem; 
        font-weight: 800; 
        color: #7e8a88; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
    }
    
    .earth-input { 
        border: 1px solid rgba(0,0,0,0.08); 
        background: rgba(255,255,255,0.6); 
        padding: 12px 18px; 
        border-radius: 12px; 
        outline: none; 
        transition: 0.3s; 
        color: #2f3635; 
        font-size: 0.95rem;
        font-weight: 600;
    }
    
    .earth-input:focus { 
        background: rgba(255,255,255,0.9); 
        border-color: #7a8c5f; 
        box-shadow: 0 0 0 4px rgba(122, 140, 95, 0.1);
    }

    .earth-save-btn { 
        background: #3e4a49; 
        color: #fff; 
        border: none; 
        border-radius: 14px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.3s; 
        text-transform: uppercase;
    }
    
    .earth-save-btn:hover { 
        background: #2f3635; 
        transform: translateY(-2px); 
        box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
    }

    .earth-discard-link {
        display: block;
        text-align: center;
        color: #a66a6a;
        text-decoration: none;
        margin-top: 25px;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: 0.3s;
    }
    
    .earth-discard-link:hover {
        opacity: 0.6;
    }

    /* Standardize dropdown appearance */
    select.earth-input {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237e8a88' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 14px;
    }
</style>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<style>
    :root { --neon-cyan: #00f2ff; --dark-bg: #0a0a0a; }
    .edit-container { padding: 50px; display: flex; justify-content: center; }
    .edit-card { 
        background: var(--dark-bg); 
        border: 1px solid #222; 
        padding: 40px; 
        border-radius: 20px; 
        width: 100%; 
        max-width: 600px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .input-group { margin-bottom: 20px; }
    .input-group label { color: #666; font-size: 0.7rem; text-transform: uppercase; display: block; margin-bottom: 8px; }
    .edit-input { 
        background: #000; border: 1px solid #333; color: #fff; padding: 12px; 
        border-radius: 8px; width: 100%; outline: none; transition: 0.3s;
    }
    .edit-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); }
    .btn-group { display: flex; gap: 15px; margin-top: 30px; }
    .update-btn { 
        background: var(--neon-cyan); color: #000; border: none; padding: 12px 30px; 
        border-radius: 30px; font-weight: bold; cursor: pointer; flex: 2;
    }
    .cancel-btn { 
        background: transparent; color: #666; border: 1px solid #333; padding: 12px 20px; 
        border-radius: 30px; text-decoration: none; text-align: center; flex: 1; font-size: 0.9rem;
    }
</style>

<div class="edit-container">
    <div class="edit-card">
        <h2 style="color: #fff; margin-bottom: 10px;">Edit Recycling Centre</h2>
        <p style="color: #555; font-size: 0.8rem; margin-bottom: 30px;">Updating records for ID: #{{ center.center_id }}</p>

        <form action="{{ url_for('editarc', id=center.center_id) }}" method="POST">
            <div class="input-group">
                <label>Centre Name</label>
                <input type="text" name="center_name" class="edit-input" value="{{ center.center_name }}" required>
            </div>

            <div class="input-group">
                <label>Location / Address</label>
                <input type="text" name="location" class="edit-input" value="{{ center.location }}" required>
            </div>

            <div class="input-group">
                <label>Contact Number</label>
                <input type="text" name="contact_number" class="edit-input" value="{{ center.contact_number }}">
            </div>

            <div class="btn-group">
                <button type="submit" class="update-btn">Save Changes</button>
                <a href="{{ url_for('admin_recycle_centre') }}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

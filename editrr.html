{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 85vh; background: #050505; padding: 20px;">
    
    <div style="background: #0a0a0a; padding: 40px; border-radius: 25px; border: 1px solid #1a1a1a; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative;">
        
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #00f2ff; border-radius: 25px 25px 0 0;"></div>

        <h2 style="color: #fff; margin-bottom: 5px; font-weight: 800; letter-spacing: -0.5px;">Update Log Entry</h2>
        <p style="color: #555; font-size: 0.85rem; margin-bottom: 30px;">Ref ID: <span style="color: #00f2ff;">#{{ r.recycle_id }}</span></p>

        <form method="POST">
            <div style="margin-bottom: 20px;">
                <label style="color:#666; font-size:0.7rem; font-weight:700; text-transform:uppercase; display:block; margin-bottom:8px;">Recycling Facility</label>
                <select name="center_id" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:12px; border-radius:10px; outline:none;" required>
                    {% for c in centers %}
                    <option value="{{ c.center_id }}" {% if c.center_id == r.center_id %}selected{% endif %}>{{ c.center_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color:#666; font-size:0.7rem; font-weight:700; text-transform:uppercase; display:block; margin-bottom:8px;">Waste Category</label>
                <select name="waste_id" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:12px; border-radius:10px; outline:none;" required>
                    {% for w in waste_types %}
                    <option value="{{ w.waste_id }}" {% if w.waste_id == r.waste_id %}selected{% endif %}>{{ w.type_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color:#666; font-size:0.7rem; font-weight:700; text-transform:uppercase; display:block; margin-bottom:8px;">Weight (KG)</label>
                <input type="number" step="0.01" name="quantity_received_kg" value="{{ r.quantity_received_kg }}" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:12px; border-radius:10px; outline:none;" required>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="color:#666; font-size:0.7rem; font-weight:700; text-transform:uppercase; display:block; margin-bottom:8px;">Date of Disposal</label>
                <input type="date" name="processing_date" value="{{ r.processing_date }}" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:12px; border-radius:10px; outline:none;" required>
            </div>

            <button type="submit" style="background:#00f2ff; color:#000; border:none; padding:15px; width:100%; border-radius:12px; font-weight:800; cursor:pointer; text-transform:uppercase; transition: 0.3s;" onmouseover="this.style.boxShadow='0 0 20px rgba(0, 242, 255, 0.4)'" onmouseout="this.style.boxShadow='none'">
                Save Updates
            </button>
            
            <a href="{{ url_for('recycle_record') }}" style="display:block; text-align:center; color:#444; margin-top:20px; text-decoration:none; font-size:0.85rem; font-weight: 600;">← Back to Records</a>
        </form>
    </div>
</div>
{% endblock %}

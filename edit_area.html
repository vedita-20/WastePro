{% extends "base.html" %}

{% block content %}
<div class="dashboard-content" style="display: flex; justify-content: center; align-items: center; padding: 60px 20px; background-color: #d6d9d2; min-height: 90vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); padding: 45px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); border-top: 6px solid #7a8c5f; width: 100%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);">
        
        <div style="text-align: center; margin-bottom: 35px;">
            <h2 style="color: #2f3635; margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Update Area Details</h2>
            <p style="color: #6b7775; font-size: 0.9rem; font-weight: 600; margin-top: 5px;">Modifying Record: <span style="font-family: monospace; color: #7a8c5f;">#{{ area.area_id }}</span></p>
        </div>
        
        <form method="POST">
            <div style="margin-bottom: 22px;">
                <label class="earth-label">Area Name</label>
                <input type="text" name="area_name" value="{{ area.area_name }}" class="earth-input" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <div style="margin-bottom: 22px;">
                <label class="earth-label">Zone Designation</label>
                <input type="text" name="zone" value="{{ area.zone }}" class="earth-input" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <div style="margin-bottom: 35px;">
                <label class="earth-label">Current Population</label>
                <input type="number" name="population" value="{{ area.population }}" class="earth-input" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <button type="submit" class="earth-save-btn" style="width: 100%; height: 55px; font-size: 0.9rem; letter-spacing: 1px;">
                Save Changes
            </button>
            
            <a href="{{ url_for('area') }}" style="display: block; text-align: center; color: #a66a6a; margin-top: 25px; text-decoration: none; font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; transition: 0.3s;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">
                Discard & Return
            </a>
        </form>
    </div>
</div>

<style>
    /* Reusing the Earth Sage UI Toolkit */
    .earth-label { 
        display: block; 
        margin-bottom: 8px; 
        font-size: 0.7rem; 
        font-weight: 800; 
        color: #7e8a88; 
        text-transform: uppercase; 
        letter-spacing: 0.5px; 
    }
    
    .earth-input { 
        border: 1px solid rgba(0,0,0,0.08); 
        background: rgba(255,255,255,0.6); 
        padding: 14px 18px; 
        border-radius: 12px; 
        outline: none; 
        transition: 0.3s; 
        color: #2f3635; 
        font-size: 1rem;
        font-weight: 600;
    }
    
    .earth-input:focus { 
        background: rgba(255,255,255,0.9); 
        border-color: #7a8c5f; 
        box-shadow: 0 0 0 4px rgba(122, 140, 95, 0.1);
    }

    .earth-save-btn { 
        background: #3e4a49; 
        color: #fff; 
        border: none; 
        padding: 14px 35px; 
        border-radius: 12px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.3s; 
        text-transform: uppercase;
    }
    
    .earth-save-btn:hover { 
        background: #2f3635; 
        transform: translateY(-2px); 
        box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
    }
</style>
{% endblock %}
